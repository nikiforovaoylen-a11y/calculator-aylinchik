<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<link rel="manifest" href="manifest.json">
					<meta name="theme-color" content="#a78bfa">
						<link rel="icon" href="icon.png">
							<link rel="apple-touch-icon" href="icon.png">
				<title>Aylinchik Calculator</title>
				<link rel="stylesheet" href="style.css">
</head>
	<body>
		<div class="wrapper">

			<!-- История -->
			<div class="history-panel">
				<button class="history-toggle" id="history-toggle">
					<span class="arrow">◀</span>
					<span class="label">History</span>
				</button>

				<div class="history-content" id="history-content">
					<ul id="history-list"></ul>
					<button id="clear-history" class="clear-history-btn">Clear</button>
				</div>
			</div>
			<!-- Калькулятор -->
			<div class="calculator">
				<div class="display" id="display">0</div>
				<div class="buttons">
					<button class="btn op" data-action="clear">C</button>
					<button class="btn op" data-action="delete">⌫</button>
					<button class="btn op" data-value="%">%</button>
					<button class="btn op" data-value="/">÷</button>

					<button class="btn" data-value="7">7</button>
					<button class="btn" data-value="8">8</button>
					<button class="btn" data-value="9">9</button>
					<button class="btn op" data-value="*">×</button>

					<button class="btn" data-value="4">4</button>
					<button class="btn" data-value="5">5</button>
					<button class="btn" data-value="6">6</button>
					<button class="btn op" data-value="-">−</button>

					<button class="btn" data-value="1">1</button>
					<button class="btn" data-value="2">2</button>
					<button class="btn" data-value="3">3</button>
					<button class="btn op" data-value="+">+</button>

					<button class="btn wide" data-value="0">0</button>
					<button class="btn" data-value=".">.</button>
					<button class="btn equal" data-action="calculate">=</button>
				</div>

				<!-- Стрелка для палитры -->
				<button class="palette-toggle" id="palette-toggle">
					<span class="arrow">▲</span>
					<span class="label">Theme</span>
				</button>

				<!-- Палитра (сворачиваемая) -->
				<div class="color-palette" id="color-palette">
					<button class="color-btn active" style="background:#a78bfa" data-color="#a78bfa" data-hover="#b99dfc"></button>
					<button class="color-btn" style="background:#f472b6" data-color="#f472b6" data-hover="#f687c3"></button>
					<button class="color-btn" style="background:#60a5fa" data-color="#60a5fa" data-hover="#7ab3fc"></button>
					<button class="color-btn" style="background:#34d399" data-color="#34d399" data-hover="#4ddba8"></button>
					<button class="color-btn" style="background:#fbbf24" data-color="#fbbf24" data-hover="#fcc842"></button>
					<button class="color-btn" style="background:#f87171" data-color="#f87171" data-hover="#fa8a8a"></button>
				</div>
			</div>

		</div>
		<script src="script.js"></script>
		<script>
			if ('serviceWorker' in navigator) {
			navigator.serviceWorker.register('/service-worker.js')
			.then(registration => console.log('SW registered'))
			.catch(error => console.log('SW failed', error));
			}
		</script>
	</body>
</html>
